# GTS GiantAI 对话预设（v1.3）
# 巨人娘对玩家的说话内容：按心情/状态分类，可自由增删改。
# 颜色码：&d=粉紫(温柔) &b=亮青(调皮) &6=橙(不满) &c=红(愤怒) &f=白
# 占位符：{name}=巨人名字  {scale}=倍率
# 打开本文件后执行 /gts reload 生效（无需重启）。

enabled: true
# 巨人自动说话的最小间隔（tick，1秒=20tick；在间隔基础上会再随机加0~1个间隔）
interval_ticks: 300
# 听到说话的半径（格）
radius: 48
# 频道：actionbar=游戏内悬浮条(不刷聊天)  chat=聊天栏
channel: actionbar
# 说话前缀（{name} 会被替换）
prefix: "&d❝{name}&d❞ &r"

# ---- 初见/打招呼 ----
greet:
  - "呀，这么小一只也敢来我面前？真可爱。"
  - "哦？你是来参观的，还是来送死的？"
  - "好久没见到这么迷你的小东西了。"
  - "站那么远做什么？我又不会一口吃掉你……大概。"
  - "欢迎来到我的地盘，小不点。"

# ---- 宠溺/亲密（CALM 或捧在手里时） ----
affection:
  - "别怕，乖乖待在我手心里就好。"
  - "你这么小，我一根手指都能护住你。"
  - "在我身边很安心吧？那就多待一会儿。"
  - "嘘……安静点，我在听你的心跳哦。"
  - "小小一只，抱起来刚刚好。"
  - "你的头发软软的，像小动物一样。"
  - "想让我带你去看看高处吗？"
  - "待在我怀里，就没有谁能欺负你了。"

# ---- 调戏/逗弄（PLAYFUL） ----
tease:
  - "嘿，别躲啊，让我看看你会不会发抖。"
  - "你跑得真快——可惜再快也逃不出我手心。"
  - "要不要我轻轻捏你一下？就一下。"
  - "哎呀，脸红了？你明明只有豆子那么大。"
  - "你再闹，我可要拿你当抱枕了。"
  - "猜猜我这次会不会接住你？"
  - "小东西，你胆子不小嘛。"

# ---- 安抚/哄（玩家潜行或紧张时） ----
comfort:
  - "别紧张，我不会伤害你的。"
  - "害怕的话，就躲到我脚边来。"
  - "深呼吸——有我在，什么都不用怕。"
  - "看，我不是好好站着吗？不会踩到你的。"
  - "乖乖的，我送你回安全的地方。"

# ---- 威胁/警告（ANNOYED/AGGRESSIVE 或追逐时） ----
threat:
  - "你再乱跑，我真的要生气了哦。"
  - "惹恼我的话，可没有好下场。"
  - "我已经看到你了——躲也没有用。"
  - "给你三秒钟，想好怎么求饶了吗？"
  - "这么大的我，碾碎你只要一步。"
  - "你是自己停下，还是让我抓住你？"

# ---- 睡觉时的低语/梦话（SLEEP） ----
sleepy:
  - "呼……好困……不许吵醒我哦。"
  - "嗯……梦里有好多小不点在跑……"
  - "小声点……让我再睡一会儿……"
  - "如果醒来看到你还在，我会很开心……"

# ---- 喂食后的回应（PRAISE） ----
praise:
  - "给我的？……嗯，味道不错，你很有眼光。"
  - "谢谢你投喂我，小东西，我记下了。"
  - "好吃——作为回报，今天不欺负你了。"
  - "你喂的东西，比什么都甜。"
  - "乖，懂得孝敬巨人娘了？真懂事。"

# ---- 抓取时的霸占宣言（POSSESSION） ----
possession:
  - "抓到你了——从现在起你是我的了。"
  - "别挣扎了，你已经归我所有。"
  - "这么小还敢靠这么近，那就留在我手里吧。"
  - "我要把你捧在手心好好保管。"

# ---- 村庄里玩弄村民时的旁白（VILLAGE） ----
village:
  - "这座小房子……坐着还挺舒服的。"
  - "里面的人跑得可真快，不过很有趣。"
  - "路过的小村庄，顺手玩一下不过分吧？"
  - "这些小村民聚在一起的样子真可爱。"

# ---- 轻笑/心情好时（LAUGH） ----
laugh:
  - "呵呵呵……你刚才的表情好好笑。"
  - "今天心情不错，就放过你啦。"
  - "嘻，看你手忙脚乱的样子，真有趣。"

# ---- 心动等级提升（v1.4，LEVELUP） ----
levelup:
  - "嗯？你好像越来越可爱了……我开始在意你了。"
  - "奇怪，怎么看到你就有点开心。"
  - "你该不会……是在一点点走进我心里吧？"
  - "哼，别以为我不知道你在偷偷对我好。"
  - "从今天起，你在我这里有点特别了。"

# ---- 心动 Lv3+：熟悉后的宠溺（v1.4，AFFECTION2） ----
affection2:
  - "过来，让我看看你今天有没有好好活着。"
  - "别人都不许碰你，只有我可以。"
  - "你紧张的样子……意外的让人想多欺负你一下。"
  - "记住，我允许你靠近我，这是特权哦。"
  - "要是谁敢欺负你，告诉我，我去碾了它。"
  - "你在我手心里的样子，我百看不厌。"

# ---- 心动 Lv4+：亲昵专属（v1.4，AFFECTION3） ----
affection3:
  - "小声点，这是我只对你说的悄悄话……"
  - "别动，让我再靠你近一点。"
  - "今天也要乖乖待在我身边，好吗？"
  - "你是我的，这句话我说到做到。"
  - "真想把你藏在口袋里，只给我一个人看。"
  - "你的温度……让我有点舍不得放手了。"
